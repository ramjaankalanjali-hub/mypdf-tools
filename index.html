<!DOCTYPE html>
<html>
<head>
  <title>MyPDF Tools</title>
  <style>
    body{
      font-family: Arial;
      background:#f5f5f5;
      text-align:center;
      padding:50px;
    }

    h1{
      color:red;
      font-size:50px;
    }

    .box{
      background:white;
      padding:30px;
      border-radius:20px;
      max-width:700px;
      margin:auto;
      box-shadow:0 0 20px rgba(0,0,0,0.1);
    }

    button{
      background:red;
      color:white;
      border:none;
      padding:15px 30px;
      border-radius:10px;
      font-size:18px;
      cursor:pointer;
    }

    .tools{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:20px;
      margin-top:40px;
    }

    .tool{
      background:white;
      padding:20px;
      border-radius:15px;
    }
  </style>
</head>

<body>

  <h1>MyPDF Tools</h1>

  <div class="box">
    <h2>Every Tool You Need To Work With PDFs</h2>

    <p>Merge, Split, Compress and Convert PDF files online.</p>

    <input type="file" id="pdfFile" multiple>
<button onclick="showMessage()">Select PDF Files</button>
<p id="fileName"></p>
    <div class="tools">

      <div class="tool">
        <h3>Merge PDF</h3>
      </div>

      <div class="tool">
        <h3>Split PDF</h3>
      </div>

      <div class="tool">
        <h3>Compress PDF</h3>
      </div>

      <div class="tool">
        <h3>JPG to PDF</h3>
      </div>

    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
